name: Bilibili 动态请求去广告实验
description: 仅删除 DynAll 请求中的广告参数，不读取或修改动态响应；用于验证不影响分页的请求侧方案。
author: egern-rule-artifacts
icon: testtube.2

env_schema:
  REMOVE_DYNAMIC_AD_PARAM:
    name: 删除动态广告参数
    description: 删除 DynAllReq 的 ad_param（protobuf 第 9 字段）；关闭后原样放行请求。
    default_value: "true"
    options: ["true", "false"]
  DYNAMIC_REQUEST_DIAGNOSTICS:
    name: 请求诊断通知
    description: 每次 DynAll 请求显示是否成功删除广告参数；确认后建议关闭。
    default_value: "true"
    options: ["true", "false"]
  DEBUG:
    name: 调试日志
    description: 仅排查问题时开启，不记录请求正文。
    default_value: "false"
    options: ["true", "false"]

scriptings:
- http_request:
    name: Bilibili DynAll 请求去广告实验
    match: ^https:\/\/(?:grpc\.biliapi\.net|app\.biliapi\.net|app\.bilibili\.com)\/bilibili\.app\.dynamic\.v2\.Dynamic\/DynAll(?:\?|$)
    script_url: https://raw.githubusercontent.com/Maaafty/egern-rule-artifacts/main/generated/Egern/Scripts/Bilibili_Clean.mjs?v=20260726-4
    update_interval: 86400
    max_size: 1048576
    timeout: 10
    body_required: true
    binary_body: true

mitm:
  hostnames:
  - app.bilibili.com
  - app.biliapi.net
  - grpc.biliapi.net
