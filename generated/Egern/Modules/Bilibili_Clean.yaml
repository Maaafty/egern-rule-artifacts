name: Bilibili Clean v3
description: 原生 Egern 哔哩哔哩净化与界面定制模块，同时处理 JSON 与 gRPC/protobuf 响应；异常时原样放行。
author: egern-rule-artifacts
icon: shield.lefthalf.filled

env_schema:
  CLEAN_HOT_SEARCH:
    name: 清理热搜
    description: 隐藏搜索页的热搜榜模块。
    default_value: "true"
    options: ["true", "false"]
  CLEAN_PROMOTION_MODULES:
    name: 清理推广模块
    description: 隐藏游戏、购物、活动横幅和大会员推广等商业入口。
    default_value: "true"
    options: ["true", "false"]
  CLEAN_COMMAND_DMS:
    name: 清理互动弹幕
    description: 隐藏投票、评分、关注等互动式弹幕。
    default_value: "true"
    options: ["true", "false"]
  SHOW_TAB_HOME:
    name: 底栏：首页
    description: 是否显示底部导航栏的首页按钮。
    default_value: "true"
    options: ["true", "false"]
  SHOW_TAB_CHANNEL:
    name: 底栏：频道
    description: 是否显示底部导航栏的频道按钮（仅在服务端下发时生效）。
    default_value: "true"
    options: ["true", "false"]
  SHOW_TAB_DYNAMIC:
    name: 底栏：动态
    description: 是否显示底部导航栏的动态按钮。
    default_value: "true"
    options: ["true", "false"]
  SHOW_TAB_PUBLISH:
    name: 底栏：发布
    description: 是否显示底部导航栏中央的发布按钮。
    default_value: "true"
    options: ["true", "false"]
  SHOW_TAB_PGC:
    name: 底栏：番剧/影视
    description: 是否显示底部导航栏的节目、番剧或影视按钮。
    default_value: "true"
    options: ["true", "false"]
  SHOW_TAB_MALL:
    name: 底栏：会员购
    description: 是否显示底部导航栏的会员购按钮。
    default_value: "true"
    options: ["true", "false"]
  SHOW_TAB_MESSAGES:
    name: 底栏：消息
    description: 是否显示底部导航栏的消息按钮（仅在服务端下发时生效）。
    default_value: "true"
    options: ["true", "false"]
  SHOW_TAB_MINE:
    name: 底栏：我的
    description: 是否显示底部导航栏的我的按钮。
    default_value: "true"
    options: ["true", "false"]
  SHOW_MINE_OFFLINE:
    name: 我的页：离线缓存
    description: 是否显示离线缓存。
    default_value: "true"
    options: ["true", "false"]
  SHOW_MINE_HISTORY:
    name: 我的页：历史记录
    description: 是否显示历史记录。
    default_value: "true"
    options: ["true", "false"]
  SHOW_MINE_FAVORITES:
    name: 我的页：我的收藏
    description: 是否显示我的收藏。
    default_value: "true"
    options: ["true", "false"]
  SHOW_MINE_WATCH_LATER:
    name: 我的页：稍后再看
    description: 是否显示稍后再看。
    default_value: "true"
    options: ["true", "false"]
  SHOW_MINE_COURSE:
    name: 我的页：我的课程
    description: 是否显示我的课程。
    default_value: "true"
    options: ["true", "false"]
  SHOW_MINE_FREE_DATA:
    name: 我的页：免流量
    description: 是否显示看视频免流量。
    default_value: "true"
    options: ["true", "false"]
  SHOW_MINE_DRESS:
    name: 我的页：个性装扮
    description: 是否显示个性装扮。
    default_value: "true"
    options: ["true", "false"]
  SHOW_MINE_GAME:
    name: 我的页：游戏
    description: 是否显示游戏中心或我的游戏。
    default_value: "true"
    options: ["true", "false"]
  SHOW_MINE_WALLET:
    name: 我的页：钱包
    description: 是否显示我的钱包。
    default_value: "true"
    options: ["true", "false"]
  SHOW_MINE_LIVE:
    name: 我的页：直播服务
    description: 是否显示直播中心、主播中心和直播活动等入口。
    default_value: "true"
    options: ["true", "false"]
  SHOW_MINE_PROMOTIONS:
    name: 我的页：活动与任务
    description: 是否显示有奖活动、任务中心、红包和能量加油站。
    default_value: "true"
    options: ["true", "false"]
  SHOW_MINE_MALL:
    name: 我的页：会员购中心
    description: 是否显示会员购中心。
    default_value: "true"
    options: ["true", "false"]
  SHOW_MINE_AUDIO:
    name: 我的页：听视频
    description: 是否显示听视频。
    default_value: "true"
    options: ["true", "false"]
  SHOW_MINE_TEEN:
    name: 我的页：青少年功能
    description: 是否显示青少年模式和青少年守护。
    default_value: "true"
    options: ["true", "false"]
  SHOW_MINE_SUPPORT:
    name: 我的页：客服
    description: 是否显示客服入口。
    default_value: "true"
    options: ["true", "false"]
  SHOW_MINE_CREATOR_SECTION:
    name: 我的页分区：创作中心
    description: 是否显示整个创作中心分区。
    default_value: "true"
    options: ["true", "false"]
  SHOW_MINE_RECOMMEND_SECTION:
    name: 我的页分区：推荐服务
    description: 是否显示整个推荐服务分区。
    default_value: "true"
    options: ["true", "false"]
  SHOW_MINE_MORE_SECTION:
    name: 我的页分区：更多服务
    description: 是否显示整个更多服务分区。
    default_value: "true"
    options: ["true", "false"]
  MINE_HIDE_ITEMS:
    name: 我的页：隐藏项目
    description: 用逗号分隔名称、数字 ID 或链接片段，例如 游戏中心,会员购,423；留空不隐藏。
    default_value: ""
  MINE_HIDE_SECTIONS:
    name: 我的页：隐藏分区
    description: 用逗号分隔分区标题或 ID，例如 创作中心,推荐服务；留空不隐藏。
    default_value: ""
  MINE_HIDE_BLOCKS:
    name: 我的页：隐藏顶层区块
    description: 高级选项；用逗号分隔响应字段名，例如 vip_section,live_tip；留空不隐藏。
    default_value: ""
  DEBUG:
    name: 调试日志
    description: 仅排查问题时开启，不记录响应正文。
    default_value: "false"
    options: ["true", "false"]

scriptings:
- http_response:
    name: Bilibili Clean JSON
    match: ^https:\/\/(?:app\.bilibili\.com|app\.biliapi\.net|api\.bilibili\.com|api\.biliapi\.net|api\.live\.bilibili\.com)\/(?:x\/resource\/show\/tab\/v2|x\/v2\/(?:account\/mine(?:\/ipad)?|splash\/(?:show|list|brand\/list|event\/list2)|feed\/index(?:\/story)?|search\/square)|pgc\/page\/(?:bangumi|cinema\/tab)|x\/web-interface\/wbi\/index\/top\/feed\/rcmd|xlive\/app-room\/v1\/index\/getInfoByRoom)(?:\?|$)
    script_url: https://raw.githubusercontent.com/Maaafty/egern-rule-artifacts/main/generated/Egern/Scripts/Bilibili_Clean.mjs?v=20260726-3
    update_interval: 86400
    max_size: 8388608
    timeout: 10
    body_required: true
    binary_body: false
- http_response:
    name: Bilibili Clean gRPC
    match: ^https:\/\/(?:grpc\.biliapi\.net|app\.biliapi\.net|app\.bilibili\.com)\/bilibili\.(?:app\.view\.v1\.View\/(?:View|TFInfo)|app\.viewunite\.v1\.View\/(?:View|RelatesFeed)|community\.service\.dm\.v1\.DM\/DmView|main\.community\.reply\.v1\.Reply\/MainList|polymer\.app\.search\.v1\.Search\/SearchAll)(?:\?|$)
    script_url: https://raw.githubusercontent.com/Maaafty/egern-rule-artifacts/main/generated/Egern/Scripts/Bilibili_Clean.mjs?v=20260726-3
    update_interval: 86400
    max_size: 8388608
    timeout: 10
    body_required: true
    binary_body: true

mitm:
  hostnames:
  - app.bilibili.com
  - app.biliapi.net
  - api.bilibili.com
  - api.biliapi.net
  - api.live.bilibili.com
  - grpc.biliapi.net
