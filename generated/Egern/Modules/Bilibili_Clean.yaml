name: Bilibili Clean 分页诊断（临时）
description: 基于当前正式版，关联记录动态请求与响应、分页游标、动态 ID、gRPC 帧及响应指纹；测试后请删除。
author: egern-rule-artifacts
icon: shield.lefthalf.filled

env_schema:
  CLEAN_HOT_SEARCH:
    name: 清理热搜
    description: 隐藏搜索页的热搜榜模块。
    default_value: "true"
    options: ["true", "false"]
  CLEAN_PROMOTION_MODULES:
    name: 清理推广模块
    description: 隐藏游戏、购物、活动横幅和大会员推广等商业入口。
    default_value: "true"
    options: ["true", "false"]
  CLEAN_DYNAMIC_EXTRAS:
    name: 精简动态页
    description: 同时隐藏动态页热门话题和最常访问；默认保留。
    default_value: "false"
    options: ["true", "false"]
  DYNAMIC_DIAGNOSTICS:
    name: 完整动态诊断
    description: 通过 iOS 通知输出分页、短指纹、帧、压缩、字节及 protobuf 结构；不含正文、账号或游标原值。
    default_value: "true"
    options: ["true", "false"]
  CLEAN_COMMAND_DMS:
    name: 清理互动弹幕
    description: 隐藏投票、评分、关注等互动式弹幕。
    default_value: "true"
    options: ["true", "false"]
  DEBUG:
    name: 调试日志
    description: 仅排查问题时开启，不记录响应正文。
    default_value: "false"
    options: ["true", "false"]

scriptings:
- http_request:
    name: Bilibili Dynamic Request Diagnostic
    match: ^https:\/\/(?:grpc\.biliapi\.net|app\.biliapi\.net|app\.bilibili\.com)\/bilibili\.app\.dynamic\.v2\.Dynamic\/(?:DynAll|DynVideo)(?:\?|$)
    script_url: https://raw.githubusercontent.com/Maaafty/egern-rule-artifacts/549978a7576b3859112c6ed618bd0aa45d6dd26c/generated/Egern/Scripts/Bilibili_Clean.mjs
    update_interval: 86400
    max_size: 8388608
    timeout: 10
    body_required: true
    binary_body: true
- http_response:
    name: Bilibili Clean JSON
    match: ^https:\/\/(?:app\.bilibili\.com|app\.biliapi\.net|api\.bilibili\.com|api\.biliapi\.net|api\.live\.bilibili\.com)\/(?:x\/v2\/(?:splash\/(?:show|list|brand\/list|event\/list2)|feed\/index(?:\/story)?|search\/square)|pgc\/page\/(?:bangumi|cinema\/tab)|x\/web-interface\/wbi\/index\/top\/feed\/rcmd|xlive\/app-room\/v1\/index\/getInfoByRoom)(?:\?|$)
    script_url: https://raw.githubusercontent.com/Maaafty/egern-rule-artifacts/549978a7576b3859112c6ed618bd0aa45d6dd26c/generated/Egern/Scripts/Bilibili_Clean.mjs
    update_interval: 86400
    max_size: 8388608
    timeout: 10
    body_required: true
    binary_body: false
- http_response:
    name: Bilibili Clean gRPC
    match: ^https:\/\/(?:grpc\.biliapi\.net|app\.biliapi\.net|app\.bilibili\.com)\/bilibili\.(?:app\.dynamic\.v2\.Dynamic\/(?:DynAll|DynVideo)|app\.view\.v1\.View\/(?:View|TFInfo)|app\.viewunite\.v1\.View\/(?:View|RelatesFeed)|community\.service\.dm\.v1\.DM\/DmView|main\.community\.reply\.v1\.Reply\/MainList|polymer\.app\.search\.v1\.Search\/SearchAll)(?:\?|$)
    script_url: https://raw.githubusercontent.com/Maaafty/egern-rule-artifacts/549978a7576b3859112c6ed618bd0aa45d6dd26c/generated/Egern/Scripts/Bilibili_Clean.mjs
    update_interval: 86400
    max_size: 8388608
    timeout: 10
    body_required: true
    binary_body: true

mitm:
  hostnames:
  - app.bilibili.com
  - app.biliapi.net
  - api.bilibili.com
  - api.biliapi.net
  - api.live.bilibili.com
  - grpc.biliapi.net
