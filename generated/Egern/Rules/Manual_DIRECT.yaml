# Manual force-DIRECT overrides.
# Keep routing entries paired with Manual_DNS_Domestic or Manual_DNS_Foreign.
# Only numbered regional Steam cache nodes override upstream routing.
# Source: https://github.com/v2fly/domain-list-community/blob/master/data/steam
domain_suffix_set:
  - "gamekee.com"
  - "qiecdn.com"
  - "maj-soul.com"
# Restrict steamcontent.com to numbered regional cache nodes.
domain_regex_set:
  - '^cache[0-9]+-[a-z0-9-]+\.steamcontent\.com$'
