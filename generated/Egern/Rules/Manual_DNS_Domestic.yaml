# Manual DNS domestic overrides.
# Keep entries paired with manual routing rules when routing is also overridden.
domain_set:
  - "x.ttzgame.cn"
domain_suffix_set:
  - "gamekee.com"
  - "qiecdn.com"
  - "maj-soul.com"
# Keep the same cache-node boundary as Manual_DIRECT.
domain_regex_set:
  - '^cache[0-9]+-[a-z0-9-]+\.steamcontent\.com$'
